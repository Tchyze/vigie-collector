# Catalogue des sources de Vigie — étude du 2026-11-13 (voir SOURCES.md).
#
# Une entrée par source. Champs :
#   id            identifiant stable (référencé par products.yaml une fois réorganisé)
#   editeur       qui publie la donnée
#   confiance     editeur | reference | communautaire
#   depend_de     pour une source communautaire : la source éditeur qu'elle reprend
#   produits      identifiants products.yaml couverts ("*" : tous)
#   donnees       A (fins de support) | B (dernière version) | C (avis) | D (security_fix)
#   url           URL (ou modèle d'URL) interrogée ; url_humaine : page consultable par un humain
#   methode       GET | POST
#   format        JSON, RSS, CSAF, CVRF, OSV, OVAL, CSV, texte, XML…
#   auth          aucune | cle-facultative | oauth
#   documentee    oui | non | partiel
#   acces         code HTTP constaté depuis la session (session) et un runner GitHub Actions (github)
#   volume        taille constatée par passage
#   fraicheur     dernière entrée constatée ; historique : profondeur disponible
#   conditions    conditions d'utilisation, mentions imposées
#   verifie_le    date du test
#   statut        recommandee | secours | actuelle | a-remplacer | ecartee
#   collecteur    collecteur existant qui l'utilise déjà (le cas échéant)

sources:

  # ---------------------------------------------------------------- transverses
  - id: endoflife-date
    editeur: endoflife.date (communauté)
    confiance: communautaire
    depend_de: pages éditeur (analyse automatique) ou saisie manuelle selon le produit
    produits: [fortios, panos, stormshield-sns, cisco-ios-xe, debian, ubuntu, rhel, rocky-linux, windows-server, vmware-esxi, vmware-vcenter, proxmox-ve, nginx, apache-httpd]
    donnees: [A, B]
    url: https://endoflife.date/api/v1/products/{slug}
    url_humaine: https://endoflife.date/{slug}
    methode: GET
    format: JSON
    auth: aucune
    documentee: oui
    acces: {session: 200, github: 200}
    volume: 2 à 10 Ko par produit
    fraicheur: mise à jour quotidienne ; latest absent pour fortios, cisco-ios-xe, sns-firmware
    conditions: données sous licence MIT ; contributions par pull request
    verifie_le: 2026-11-13
    statut: recommandee
    collecteur: endoflife

  - id: cisa-kev
    editeur: CISA
    confiance: reference
    produits: ["*"]
    donnees: [C]
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    miroir: https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json
    url_humaine: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    methode: GET
    format: JSON
    auth: aucune
    documentee: oui
    acces: {session: 200, github: 200}
    volume: 1,8 Mo
    fraicheur: catalogue 2026.11.10 ; 1 779 entrées depuis 2021-11-03
    conditions: domaine public (CC0)
    verifie_le: 2026-11-13
    statut: recommandee
    usage: marquer les CVE exploitées (nouveau champ facultatif)

  - id: nvd-api
    editeur: NIST NVD
    confiance: reference
    produits: [fortios, stormshield-sns, vmware-esxi, vmware-vcenter, dell-idrac, hpe-ilo, openssh, proxmox-ve]
    donnees: [C]
    url: https://services.nvd.nist.gov/rest/json/cves/2.0?sourceIdentifier={cna}&lastModStartDate={debut}&lastModEndDate={fin}
    url_humaine: https://nvd.nist.gov/vuln/detail/{cve}
    methode: GET
    format: JSON
    auth: cle-facultative
    documentee: oui
    acces: {session: 200, github: "200 (instable)"}
    volume: 20 à 300 Ko par requête ; 1 à 15 s par requête
    fiabilite: "depuis GitHub, sans clé : 4 puis 2 requêtes sur 7 réussies le 2026-11-13 (délais dépassés à 30 s, 503) ; prévoir 60 s, nouvel essai, jamais bloquante"
    fraicheur: CVE du jour ; enrichissement NVD souvent absent (« Awaiting Analysis », « Deferred »)
    conditions: >-
      sans clé 5 requêtes / 30 s, avec clé gratuite 50 / 30 s ; fenêtre de dates ≤ 120 jours ;
      mention « This product uses the NVD API but is not endorsed or certified by the NVD »
    verifie_le: 2026-11-13
    statut: recommandee
    usage: découverte des CVE par CNA (cert@airbus.com, security_alert@emc.com, security-alert@hpe.com, security@vmware.com, psirt@fortinet.com) ou mot-clé (iDRAC)
    decision: pas de clé pour l'instant (2026-11-13) ; plus tard, secret GitHub NVD_API_KEY

  - id: cve-org
    editeur: CVE Program (MITRE) — contenu publié par le CNA de l'éditeur
    confiance: reference
    produits: [fortios, panos, stormshield-sns, vmware-esxi, vmware-vcenter, dell-idrac, hpe-ilo, apache-httpd, nginx, openssh]
    donnees: [C, D]
    url: https://cveawg.mitre.org/api/cve/{cve}
    url_humaine: https://www.cve.org/CVERecord?id={cve}
    methode: GET
    format: JSON CVE 5
    auth: aucune
    documentee: oui
    acces: {session: 200, github: 200}
    volume: 5 à 25 Ko par CVE
    fraicheur: publication du CNA, sans délai NVD
    conditions: conditions d'utilisation CVE (reproduction libre, mention du programme CVE)
    verifie_le: 2026-11-13
    statut: recommandee
    note: "pas de recherche ; découverte par nvd-api. Champ affected[].versions (lessThan peut contenir du texte : « 7.30.10.50 or later »)"

