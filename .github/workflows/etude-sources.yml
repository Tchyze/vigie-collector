name: Étude des sources — test d'accès

# Phase d'étude : interroge chaque URL candidate (etude-sources/candidats.tsv) depuis un runner
# GitHub Actions et écrit dans le résumé du job un tableau URL / code HTTP / taille / durée.
# Aucun secret, aucune authentification : un 401/403 est consigné tel quel.
on:
  workflow_dispatch:
  push:
    branches: [claude/great-bell-6u816g]
    paths: [etude-sources/candidats.tsv, etude-sources/probe.py, .github/workflows/etude-sources.yml]

permissions:
  contents: write            # enregistrement des résultats sur la branche d'étude

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sonde des sources candidates
        run: |
          python etude-sources/probe.py --title "Accès depuis GitHub Actions ($(date -u +%Y-%m-%dT%H:%MZ), run ${{ github.run_id }})" --json resultats-github.json > resultats-github.md
      - name: Tableau compact (journal)
        run: |
          python - <<'PY'
          import json
          for r in json.load(open("resultats-github.json")):
              size = f"{r['bytes']}{'+' if r['truncated'] else ''}"
              print(f"COMPACT\t{r['id']}\t{r['status'] or r['error'][:60]}\t{size}\t{r['seconds']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resultats-acces-github
          path: resultats-github.*
      # Les journaux et artefacts ne sont pas lisibles partout : les résultats sont aussi
      # enregistrés sur la branche d'étude (un push par GITHUB_TOKEN ne relance pas le workflow).
      - name: Enregistrement des résultats sur la branche
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p etude-sources/resultats
          cp resultats-github.json etude-sources/resultats/github.json
          cp resultats-github.md etude-sources/resultats/github.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etude-sources/resultats
          git commit -m "Étude des sources : résultats du test d'accès depuis GitHub Actions (run ${{ github.run_id }})" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
